{% extends "base.html" %}
{% block title %}App Settings — Admin{% endblock %}

{% block content %}
<div class="page-wrap" style="max-width:600px;">
  <h3 class="section-title">⚙️ App / Web Settings</h3>
  <div class="card-soft p-4">
    <form method="POST" action="{{ url_for('admin.settings') }}" enctype="multipart/form-data">
      
      <div class="mb-3">
        <label class="form-label">App / Web Name</label>
        <input type="text" name="app_name" class="form-control" value="{{ settings.app_name }}" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Current Logo</label><br>
        <img src="{{ url_for('static', filename=settings.logo_path) }}" style="width:64px;height:64px;object-fit:contain;" class="mb-2" onerror="this.style.display='none'">
        <input type="file" name="logo" accept="image/*" class="form-control">
      </div>
      
      
      
      <div class="mb-4">
        <label class="form-label">Background Opacity</label>
        <input type="range" name="bg_opacity" class="form-range" min="0" max="1" step="0.05" value="{{ settings.bg_opacity|default(0.05) }}">
      </div>
      
      <button type="submit" class="btn btn-brand">Save Settings ✅</button>
    </form>
  </div>
</div>
{% endblock %}
