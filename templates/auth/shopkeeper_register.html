{% extends "base.html" %}
{% block title %}Shop Registration — {{ app_settings.app_name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="max-width: 560px;">
    <span class="auth-icon">🏪</span>
    <h3 class="text-center fw-bold mb-1">Register Your Shop</h3>
    <p class="text-center text-muted mb-4">GSTIN is optional — you can register without one</p>
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Owner Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Shop Name</label>
          <input type="text" name="shop_name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email (optional)</label>
          <input type="email" name="email" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">GSTIN <span class="text-muted small">(optional)</span></label>
          <input type="text" name="gstin" class="form-control" placeholder="Leave blank if none">
        </div>
        <div class="col-md-6">
          <label class="form-label">Area / Locality <span class="text-muted small">(for location search)</span></label>
          <input type="text" name="location_area" class="form-control" placeholder="e.g. Indiranagar">
        </div>
        <div class="col-12">
          <label class="form-label">Shop Address</label>
          <textarea name="shop_address" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">UPI ID <span class="text-muted small">(QR auto-generated from this)</span></label>
          <input type="text" name="upi_id" class="form-control" placeholder="yourname@upi">
        </div>
        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Security Question <span class="text-muted small">(for password reset)</span></label>
          <select name="security_question" class="form-select">
            <option>What is your favourite food?</option>
            <option>What is your pet's name?</option>
            <option>What city were you born in?</option>
            <option>What is your mother's maiden name?</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Your Answer</label>
          <input type="text" name="security_answer" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-brand w-100 mt-4 mb-3">Register Shop 🎉</button>
      <div class="text-center small">
        Already registered? <a href="{{ url_for('auth.shopkeeper_login') }}">Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
