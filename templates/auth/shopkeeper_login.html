{% extends "base.html" %}
{% block title %}Shopkeeper Login — {{ app_settings.app_name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="auth-icon">🏪</span>
    <h3 class="text-center fw-bold mb-1">Shopkeeper Login</h3>
    <p class="text-center text-muted mb-4">Manage your shop with ease</p>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" name="phone" class="form-control" placeholder="10-digit phone number" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 mb-3">Login</button>
      <div class="d-flex justify-content-between small">
        <a href="{{ url_for('auth.shopkeeper_forgot') }}">Forgot password?</a>
        <a href="{{ url_for('auth.shopkeeper_register') }}">New shop? Register</a>
      </div>
      <div class="text-center mt-4">
        <a href="{{ url_for('auth.select_role') }}" class="small text-muted">← Back to role selection</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
